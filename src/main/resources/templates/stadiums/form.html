<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${stadiumId} ? '경기장 수정' : '경기장 등록')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main>
    <div class="page-title">
        <h1 th:text="${stadiumId} ? '경기장 수정' : '경기장 등록'"></h1>
    </div>

    <form class="form" method="post" th:object="${stadiumForm}"
          th:action="${stadiumId} ? @{/stadiums/{id}(id=${stadiumId})} : @{/stadiums}">
        <div class="field">
            <label for="name">경기장 이름</label>
            <input type="text" th:field="*{name}" maxlength="100" required>
            <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>
        <div class="field">
            <label for="city">도시 (선택)</label>
            <input type="text" th:field="*{city}" maxlength="50">
            <p class="error" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></p>
        </div>
        <div class="field">
            <label for="capacity">수용 인원 (선택)</label>
            <input type="number" th:field="*{capacity}" min="0">
            <p class="error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></p>
        </div>
        <div class="form-actions">
            <button type="submit" class="button primary">저장</button>
            <a class="button" th:href="@{/stadiums}">취소</a>
        </div>
    </form>
</main>
</body>
</html>
