<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | KickStats'">KickStats</title>
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:fragment="nav" class="site-header">
    <a class="brand" th:href="@{/}">KickStats</a>
    <nav>
        <a th:href="@{/leagues}">리그</a>
    </nav>
</header>
<p th:fragment="message" th:if="${message}" th:text="${message}" class="message" role="status"></p>
</body>
</html>
