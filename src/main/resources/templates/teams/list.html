<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('팀')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main>
    <div class="page-title">
        <h1>팀</h1>
        <a class="button primary" th:href="@{/teams/new}">팀 등록</a>
    </div>
    <p th:replace="~{fragments/layout :: message}"></p>

    <p th:if="${teams.isEmpty()}" class="empty">등록된 팀이 없습니다.</p>
    <ul th:unless="${teams.isEmpty()}" class="card-list">
        <li th:each="team : ${teams}" class="card-row">
            <div>
                <p class="card-row-title" th:text="${team.name}"></p>
                <p class="card-row-subtitle meta">
                    <span th:if="${team.city}" th:text="${team.city}"></span>
                    <span th:if="${team.homeStadium}" th:text="${team.homeStadium.name}"></span>
                    <span th:if="${team.foundedYear != null}" th:text="${team.foundedYear} + '년 창단'"></span>
                </p>
            </div>
            <div class="actions">
                <a class="button" th:href="@{/teams/{id}/edit(id=${team.teamId})}">수정</a>
                <form th:action="@{/teams/{id}/delete(id=${team.teamId})}" method="post"
                      onsubmit="return confirm('이 팀을 삭제할까요?\n계약 이력과 시즌 참가 정보도 함께 삭제됩니다.');">
                    <button type="submit" class="button danger">삭제</button>
                </form>
            </div>
        </li>
    </ul>
</main>
</body>
</html>
